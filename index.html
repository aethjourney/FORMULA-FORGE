<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaChamps — Formula Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void: #0d0e1c;
    --panel: #16213e;
    --panel-edge: #0a0f24;
    --mint: #06d6a0;
    --mint-dim: #04a37a;
    --amber: #ffd166;
    --alert: #ef476f;
    --text: #eef2f7;
    --text-dim: #8b93b5;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg-void);
    font-family:'Space Mono', monospace;
    color: var(--text);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
  }
  .console{
    position:relative; width:100%; max-width:560px; margin:24px;
    background: var(--panel);
    border:4px solid var(--panel-edge);
    box-shadow: 0 0 0 4px #2a3357, 0 20px 60px rgba(0,0,0,0.6);
    overflow:hidden;
  }
  .console::after{
    content:""; position:absolute; inset:0;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.12) 3px, rgba(0,0,0,0.12) 4px);
    pointer-events:none; z-index:5;
  }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:var(--panel-edge); border-bottom:3px solid #2a3357; }
  .brand{ font-family:'Press Start 2P', monospace; font-size:10px; color:var(--mint); letter-spacing:1px; }
  .semester-tag{ font-family:'Press Start 2P', monospace; font-size:8px; color:var(--amber); background:rgba(255,209,102,0.08); border:1px solid var(--amber); padding:4px 6px; }

  .meter-wrap{ padding:12px 14px 6px; border-bottom:3px solid #2a3357; }
  .meter-label{ font-size:10px; color:var(--text-dim); display:flex; justify-content:space-between; margin-bottom:6px; }
  .meter-label b{ color:var(--mint); }
  .meter{ display:flex; gap:3px; height:14px; }
  .meter-seg{ flex:1; background:#1f2745; border:2px solid var(--panel-edge); transition: background .25s ease; }
  .meter-seg.filled{ background: var(--mint); }

  .stage{ padding:18px 16px 20px; min-height:400px; display:flex; flex-direction:column; }

  .screen-title{ font-family:'Press Start 2P', monospace; font-size:13px; margin:0 0 4px; line-height:1.6; }
  .screen-sub{ font-size:11px; color:var(--text-dim); margin:0 0 14px; line-height:1.6; }

  .timer-wrap{ margin-bottom:14px; }
  .timer-label{ display:flex; justify-content:space-between; font-size:9px; color:var(--text-dim); margin-bottom:4px; }
  .timer-label span#timerVal{ color:var(--amber); }
  .timer-track{ height:8px; background:#1f2745; border:2px solid var(--panel-edge); overflow:hidden; }
  .timer-fill{ height:100%; background:var(--mint); width:100%; transition:width .1s linear, background .2s ease; }
  .timer-fill.mid{ background:var(--amber); }
  .timer-fill.low{ background:var(--alert); }

  .case-card{ background:#0f1730; border:2px solid #2a3357; padding:13px; margin-bottom:14px; position:relative; }
  .case-card::before{ content:attr(data-tag); position:absolute; top:-11px; left:10px; font-family:'Press Start 2P', monospace; font-size:8px; background:var(--mint); color:#06251c; padding:3px 6px; }
  .case-body{ font-size:12.5px; line-height:1.7; }
  .case-body b{ color:var(--amber); }

  .seq-title{ font-family:'Press Start 2P', monospace; font-size:9px; color:var(--text-dim); margin-bottom:8px; }
  .seq-row{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .seq-slot{
    border:2px dashed #2a3357; padding:9px 10px; font-size:11.5px; color:var(--text-dim);
    display:flex; gap:8px; align-items:center; min-height:20px;
  }
  .seq-slot .num{ font-family:'Press Start 2P', monospace; font-size:9px; color:var(--text-dim); flex-shrink:0; }
  .seq-slot.filled{ border-style:solid; border-color:var(--mint); background:rgba(6,214,160,0.07); color:var(--text); }
  .seq-slot.filled .num{ color:var(--mint); }
  .seq-slot.current{ border-color:var(--amber); }
  .seq-slot.current .num{ color:var(--amber); }

  .grid-title{ font-family:'Press Start 2P', monospace; font-size:9px; color:var(--text-dim); margin-bottom:8px; }
  .item-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .item-btn{
    text-align:left; background:#1f2745; border:2px solid #34406e; color:var(--text);
    font-family:'Space Mono', monospace; font-size:11.5px; padding:10px; cursor:pointer; line-height:1.4;
  }
  .item-btn:hover:not(:disabled){ background:#26305a; border-color:var(--mint-dim); }
  .item-btn:active:not(:disabled){ transform:translateY(1px); }
  .item-btn:disabled{ opacity:0.3; cursor:default; }
  .item-btn.flash-wrong{ background:rgba(239,71,111,0.25); border-color:var(--alert); }
  .item-btn.flash-correct{ background:rgba(6,214,160,0.25); border-color:var(--mint); }

  .tap-feedback{ font-size:10.5px; color:var(--text-dim); min-height:16px; margin-bottom:10px; }
  .tap-feedback.wrong{ color:var(--alert); }
  .tap-feedback.correct{ color:var(--mint); }

  .feedback{ margin-top:auto; font-size:12px; line-height:1.7; padding:12px; border-left:3px solid var(--mint); background:rgba(6,214,160,0.06); display:none; }
  .feedback.show{ display:block; }
  .feedback.wrong{ border-left-color:var(--alert); background:rgba(239,71,111,0.06); }
  .feedback .verdict{ font-family:'Press Start 2P', monospace; font-size:10px; display:block; margin-bottom:8px; }
  .feedback.correct-verdict .verdict{ color:var(--mint); }
  .feedback.wrong .verdict{ color:var(--alert); }

  .next-btn{ margin-top:14px; align-self:flex-end; font-family:'Press Start 2P', monospace; font-size:10px; background:var(--amber); color:#3a2a00; border:none; padding:10px 16px; cursor:pointer; display:none; }
  .next-btn.show{ display:inline-block; }

  .end-screen{ display:none; text-align:center; padding:20px 6px; }
  .end-screen.show{ display:block; }
  .end-title{ font-family:'Press Start 2P', monospace; font-size:14px; color:var(--mint); margin-bottom:14px; line-height:1.6; }
  .end-score{ font-size:34px; color:var(--amber); font-weight:700; margin:10px 0; }
  .end-desc{ font-size:12px; color:var(--text-dim); line-height:1.7; margin-bottom:20px; }
  .restart-btn{ font-family:'Press Start 2P', monospace; font-size:10px; background:var(--mint); color:#06251c; border:none; padding:12px 18px; cursor:pointer; }

  .play-wrap.hidden, .end-holder.hidden{ display:none; }

  footer.note{ font-size:10px; color:var(--text-dim); text-align:center; padding:10px; border-top:3px solid #2a3357; background:var(--panel-edge); }
</style>
</head>
<body>

<div class="console">
  <div class="topbar">
    <div class="brand">PHARMACHAMPS</div>
    <div class="semester-tag">FORMULA FORGE</div>
  </div>

  <div class="meter-wrap">
    <div class="meter-label"><span>POIN RACIKAN</span><span><b id="pointNow">0</b> / <span id="pointTarget">300</span></span></div>
    <div class="meter" id="meter"></div>
  </div>

  <div class="stage">
    <div class="play-wrap" id="playWrap">
      <h2 class="screen-title" id="roundNumber">RESEP 1 / 4</h2>
      <p class="screen-sub" id="roundName"></p>

      <div class="case-card" data-tag="RESEP MASUK">
        <div class="case-body" id="caseBody"></div>
      </div>

      <div class="seq-title">URUTAN LANGKAH (tap dari rak sesuai urutan)</div>
      <div class="seq-row" id="seqRow"></div>

      <div class="grid-title">RAK ALAT &amp; BAHAN</div>
      <div class="item-grid" id="itemGrid"></div>
      <div class="tap-feedback" id="tapFeedback"></div>

      <div class="feedback" id="feedback">
        <span class="verdict" id="verdict"></span>
        <span id="explanation"></span>
      </div>

      <button class="next-btn" id="nextBtn">LANJUT →</button>
    </div>

    <div class="end-holder hidden" id="endHolder">
      <div class="end-screen show">
        <div class="end-title">SESI RACIK OBAT<br>SELESAI</div>
        <div class="end-score" id="finalScore">0</div>
        <div class="end-desc" id="finalDesc"></div>
        <button class="restart-btn" id="restartBtn">ULANGI PROTOTYPE</button>
      </div>
    </div>
  </div>

  <footer class="note">prototype mini-game · v0.1 · gaya rak akan diganti sprite alat lab asli di Unity</footer>
</div>

<script>
const TARGET_POINTS = 300;
const TIME_LIMIT = 25;

const rounds = [
  {
    name: "Puyer Parasetamol untuk Anak",
    case: `Seorang anak memerlukan <b>puyer Parasetamol</b> sesuai dosis dokter. Susun langkah peracikan yang benar dari rak di bawah.`,
    steps: [
      "Timbang tablet Parasetamol sesuai dosis resep",
      "Gerus tablet dengan mortir & stamper hingga halus",
      "Tambahkan bahan pengisi (Laktosa) sedikit demi sedikit",
      "Campur hingga homogen",
      "Bagi rata menjadi beberapa bungkus puyer"
    ],
    distractors: ["Panaskan larutan hingga mendidih", "Sterilkan dengan autoklaf", "Saring dengan kertas saring", "Ukur pH dengan kertas lakmus"],
    explanation: "Urutan SOP puyer: timbang bahan aktif → gerus halus → tambahkan pengisi bertahap → campur homogen → bagi rata. Tidak melibatkan sterilisasi/pemanasan karena sediaan padat oral non-steril."
  },
  {
    name: "Salep 2-4 (Asam Salisilat + Asam Benzoat)",
    case: `Resep meminta <b>Salep 2-4</b> — kombinasi Asam Salisilat 2% dan Asam Benzoat 4% dalam basis vaselin. Susun langkah peracikannya.`,
    steps: [
      "Timbang Asam Salisilat 2% dan Asam Benzoat 4%",
      "Gerus kedua bahan hingga halus di mortir",
      "Tambahkan sedikit vaselin, gerus rata membentuk pasta",
      "Tambahkan sisa vaselin sedikit demi sedikit sambil diaduk",
      "Masukkan ke pot salep dan beri etiket"
    ],
    distractors: ["Larutkan dalam air suling", "Kocok dalam botol bertutup", "Simpan di lemari pendingin 2-8°C", "Rekonstitusi dengan pelarut khusus"],
    explanation: "Sediaan semisolid seperti salep dibuat dengan teknik levigasi: bahan aktif digerus halus, dibuat pasta dengan sedikit basis dulu (mengurangi risiko partikel kasar), baru dicampur bertahap dengan sisa basis."
  },
  {
    name: "Larutan Oralit",
    case: `Pasien diare ringan memerlukan <b>larutan oralit</b> untuk rehidrasi. Susun langkah penyiapannya sesuai anjuran.`,
    steps: [
      "Siapkan air matang sebanyak 200 mL",
      "Tuang 1 sachet oralit ke dalam air",
      "Aduk hingga larut sempurna",
      "Simpan dalam wadah tertutup, beri label & tanggal buat"
    ],
    distractors: ["Gerus hingga menjadi serbuk halus", "Timbang menggunakan neraca analitik", "Panaskan hingga mendidih", "Saring menggunakan kertas saring"],
    explanation: "Oralit adalah sediaan larutan siap minum yang dilarutkan langsung dalam air matang bersuhu ruang — tidak perlu digerus, ditimbang ulang, atau dipanaskan karena dapat merusak elektrolit."
  },
  {
    name: "Sirup Rekonstitusi Antibiotik",
    case: `Antibiotik sirup kering (dry syrup) perlu <b>direkonstitusi</b> sebelum diberikan ke pasien. Susun langkah penyiapannya.`,
    steps: [
      "Kocok botol serbuk kering sebelum ditambah air",
      "Tambahkan air matang sampai batas tanda pada botol",
      "Kocok kembali hingga campuran homogen",
      "Beri etiket 'Kocok dahulu' dan tanggal kadaluarsa setelah rekonstitusi"
    ],
    distractors: ["Gerus serbuk dengan mortir", "Panaskan botol di atas api kecil", "Saring dengan kain kasa", "Diamkan 24 jam sebelum diminum"],
    explanation: "Sirup kering direkonstitusi dengan menambah air matang tepat sampai batas tanda, dikocok, lalu diberi etiket 'kocok dahulu' karena sifatnya suspensi yang mudah mengendap dan punya masa pakai terbatas setelah dicampur air."
  }
];

let currentRound = 0;
let totalScore = 0;
let expectedIndex = 0;
let wrongTaps = 0;
let usedIds = new Set();
let roundEnded = false;

const meterEl = document.getElementById('meter');
const SEGMENTS = 20;
for(let i=0;i<SEGMENTS;i++){
  const seg = document.createElement('div');
  seg.className='meter-seg';
  meterEl.appendChild(seg);
}
function updateMeter(){
  document.getElementById('pointNow').textContent = totalScore;
  const filled = Math.min(SEGMENTS, Math.round((totalScore/TARGET_POINTS)*SEGMENTS));
  [...meterEl.children].forEach((seg,i)=> seg.classList.toggle('filled', i<filled));
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function renderRound(){
  roundEnded=false;
  expectedIndex=0; wrongTaps=0; usedIds=new Set();
  const r = rounds[currentRound];
  document.getElementById('roundNumber').textContent = `RESEP ${currentRound+1} / ${rounds.length}`;
  document.getElementById('roundName').textContent = r.name;
  document.getElementById('caseBody').innerHTML = r.case;

  const seqRow = document.getElementById('seqRow');
  seqRow.innerHTML='';
  r.steps.forEach((_,idx)=>{
    const slot = document.createElement('div');
    slot.className='seq-slot' + (idx===0?' current':'');
    slot.id = 'slot-'+idx;
    slot.innerHTML = `<span class="num">${idx+1}.</span><span>Belum diisi...</span>`;
    seqRow.appendChild(slot);
  });

  const items = shuffle([
    ...r.steps.map((text,idx)=>({id:'s'+idx, text, correctOrder:idx})),
    ...r.distractors.map((text,idx)=>({id:'d'+idx, text, correctOrder:-1}))
  ]);

  const grid = document.getElementById('itemGrid');
  grid.innerHTML='';
  items.forEach(item=>{
    const btn = document.createElement('button');
    btn.className='item-btn';
    btn.textContent = item.text;
    btn.dataset.id = item.id;
    btn.addEventListener('click', ()=> handleTap(btn, item, r));
    grid.appendChild(btn);
  });

  document.getElementById('tapFeedback').textContent='';
  document.getElementById('tapFeedback').className='tap-feedback';
  const fb = document.getElementById('feedback');
  fb.classList.remove('show','wrong','correct-verdict');
  document.getElementById('nextBtn').classList.remove('show');
}

function handleTap(btn, item, r){
  if(roundEnded || usedIds.has(item.id)) return;
  const tapFb = document.getElementById('tapFeedback');

  if(item.correctOrder === expectedIndex){
    usedIds.add(item.id);
    btn.disabled = true;
    btn.classList.add('flash-correct');
    const slot = document.getElementById('slot-'+expectedIndex);
    slot.classList.remove('current');
    slot.classList.add('filled');
    slot.innerHTML = `<span class="num">${expectedIndex+1}.</span><span>${item.text}</span>`;
    tapFb.textContent = 'Tepat! Lanjut ke langkah berikutnya.';
    tapFb.className = 'tap-feedback correct';
    expectedIndex++;
    const nextSlot = document.getElementById('slot-'+expectedIndex);
    if(nextSlot) nextSlot.classList.add('current');
    if(expectedIndex >= r.steps.length){
      endRound(true);
    }
  } else {
    wrongTaps++;
    btn.classList.add('flash-wrong');
    setTimeout(()=> btn.classList.remove('flash-wrong'), 350);
    tapFb.textContent = item.correctOrder === -1
      ? 'Bahan/alat ini tidak diperlukan di resep ini.'
      : 'Belum waktunya — cek lagi urutan SOP-nya.';
    tapFb.className = 'tap-feedback wrong';
  }
}

function endRound(success){
  roundEnded = true;
  document.querySelectorAll('.item-btn').forEach(b=> b.disabled=true);

  const r = rounds[currentRound];
  const base = r.steps.length * 20;
  const penalty = wrongTaps * 5;
  const points = Math.max(0, base - penalty);
  totalScore += points;
  updateMeter();

  const fb = document.getElementById('feedback');
  fb.classList.add('show','correct-verdict');
  document.getElementById('verdict').textContent = `RACIKAN SELESAI! +${points} POIN`;
  document.getElementById('explanation').textContent = r.explanation;
  document.getElementById('nextBtn').classList.add('show');
}

document.getElementById('nextBtn').addEventListener('click', ()=>{
  currentRound++;
  if(currentRound >= rounds.length){
    showEnd();
  } else {
    renderRound();
  }
});

function showEnd(){
  document.getElementById('playWrap').classList.add('hidden');
  document.getElementById('endHolder').classList.remove('hidden');
  document.getElementById('finalScore').textContent = totalScore;
  const reached = totalScore >= TARGET_POINTS;
  document.getElementById('finalDesc').textContent = reached
    ? `Target poin racikan tercapai! SOP peracikan kamu sudah cukup rapi.`
    : `Belum mencapai target ${TARGET_POINTS} poin. Perhatikan urutan SOP dan kecepatan racikmu lagi.`;
}

document.getElementById('restartBtn').addEventListener('click', ()=>{
  currentRound=0; totalScore=0;
  document.getElementById('playWrap').classList.remove('hidden');
  document.getElementById('endHolder').classList.add('hidden');
  updateMeter();
  renderRound();
});

updateMeter();
renderRound();
</script>

</body>
</html>
